name: Deploy a Azure App Service

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: cloudops-hub-web
  NODE_VERSION: '22.x'

jobs:
  build:
    name: Build y pruebas
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar pruebas
        run: npm test

      - name: Empaquetar artefacto
        run: |
          zip -r app.zip . -x "*.git*" "test/*" ".github/*"

      - name: Subir artefacto
        uses: actions/upload-artifact@v4
        with:
          name: webapp
          path: app.zip

  deploy:
    name: Despliegue a Azure
    needs: build
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Descargar artefacto
        uses: actions/download-artifact@v4
        with:
          name: webapp

      - name: Iniciar sesión en Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Desplegar a Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          package: app.zip

      - name: Verificar despliegue
        run: |
          sleep 15
          curl -f https://${{ env.AZURE_WEBAPP_NAME }}.azurewebsites.net/health
