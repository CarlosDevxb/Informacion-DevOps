# Azure Pipeline: CI/CD de CloudOps Hub — DevOps y computo en la nube
trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main

pool:
  vmImage: ubuntu-latest

variables:
  nodeVersion: '22.x'
  azureSubscription: 'mi-suscripcion-azure'
  webAppName: 'cloudops-hub-web'

stages:
  - stage: Build
    displayName: 'Build y pruebas'
    jobs:
      - job: BuildJob
        displayName: 'Compilar y probar'
        steps:
          - task: UseNode@1
            displayName: 'Configurar Node.js'
            inputs:
              version: $(nodeVersion)

          - script: npm ci
            displayName: 'Instalar dependencias'

          - script: npm test
            displayName: 'Ejecutar pruebas'

          - task: ArchiveFiles@2
            displayName: 'Empaquetar artefacto'
            inputs:
              rootFolderOrFile: '$(System.DefaultWorkingDirectory)'
              includeRootFolder: false
              archiveType: 'zip'
              archiveFile: '$(Build.ArtifactStagingDirectory)/$(Build.BuildId).zip'
              replaceExistingArchive: true

          - task: PublishBuildArtifacts@1
            displayName: 'Publicar artefacto'
            inputs:
              PathtoPublish: '$(Build.ArtifactStagingDirectory)'
              ArtifactName: 'drop'

  - stage: Deploy
    displayName: 'Despliegue a Azure App Service'
    dependsOn: Build
    condition: succeeded()
    jobs:
      - deployment: DeployJob
        displayName: 'Desplegar'
        environment: 'produccion'
        strategy:
          runOnce:
            deploy:
              steps:
                - task: AzureWebApp@1
                  displayName: 'Desplegar a $(webAppName)'
                  inputs:
                    azureSubscription: $(azureSubscription)
                    appType: 'webAppLinux'
                    appName: $(webAppName)
                    package: '$(Pipeline.Workspace)/drop/$(Build.BuildId).zip'
                    runtimeStack: 'NODE:22-lts'
                    startupCommand: 'npm start'

                - script: |
                    curl -f https://$(webAppName).azurewebsites.net/health
                  displayName: 'Verificar despliegue (health check)'
